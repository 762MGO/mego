<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人排班</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007AFF',
                        secondary: '#5856D6',
                        success: '#34C759',
                        warning: '#FF9500',
                        danger: '#FF3B30',
                        bgPage: '#F2F4F8',
                        bgCard: '#FFFFFF',
                        bgGray: '#E9EBF0',
                        textMain: '#1C1C1E',
                        textSub: '#8A8A8E',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card { @apply bg-bgCard rounded-2xl p-5 shadow-md; }
            .btn { @apply rounded-xl px-4 py-3 font-medium transition-all active:scale-[0.96] flex items-center justify-center gap-2; }
            .btn-primary { @apply bg-primary text-white; }
            .btn-gray { @apply bg-bgGray text-textMain; }
            .btn-danger { @apply bg-danger text-white; }
            .input { @apply w-full rounded-xl p-3 bg-bgGray outline-none border-0; }
            .page { @apply hidden; }
            .page.active { @apply block; }
            .nav-item { @apply flex flex-col items-center justify-center py-1 transition-all active:scale-95 text-textSub; }
            .nav-item.active { @apply text-primary; }
            .day-cell { @apply p-2 rounded-lg cursor-pointer; }
            .day-cell-selected { @apply ring-2 ring-primary; }
            .todo-line { @apply line-through text-textSub; }
        }
    </style>
</head>
<body class="bg-bgPage min-h-screen text-textMain pb-20">
    <div class="max-w-xl mx-auto p-4">
        <h1 class="text-xl font-bold text-center my-6">个人排班</h1>

        <!-- 首页 -->
        <div id="page-home" class="page active">
            <div class="card mb-5">
                <h2 class="text-textSub text-sm mb-2"><i class="bi bi-calendar-check"></i> 今日排班</h2>
                <div id="today-shift" class="text-2xl font-semibold text-primary">加载中...</div>
                <div id="shift-time" class="text-textSub mt-1"></div>
                <div id="shift-countdown" class="mt-3 text-lg font-medium"></div>
                <div id="today-note" class="mt-2 text-warning"></div>
            </div>

            <div class="card mb-5">
                <h2 class="text-textSub text-sm mb-2"><i class="bi bi-calendar-next"></i> 次日班次预告</h2>
                <div id="tomorrow-shift" class="text-xl font-semibold text-secondary">加载中...</div>
                <div id="tomorrow-shift-time" class="text-textSub mt-1"></div>
            </div>
        </div>

        <!-- 日历页【修复下拉UI + 批量导入】 -->
        <div id="page-calendar" class="page">
            <div class="card mb-5">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="btn btn-gray text-sm px-3 py-2">
                        <i class="bi bi-chevron-left"></i>上月
                    </button>
                    <h2 id="cal-title" class="font-semibold"></h2>
                    <button onclick="changeMonth(1)" class="btn btn-gray text-sm px-3 py-2">
                        下月<i class="bi bi-chevron-right"></i>
                    </button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-sm mb-2">
                    <div class="text-textSub">一</div><div class="text-textSub">二</div><div class="text-textSub">三</div>
                    <div class="text-textSub">四</div><div class="text-textSub">五</div><div class="text-textSub">六</div><div class="text-textSub">日</div>
                </div>
                <div id="cal-grid" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
            </div>

            <!-- 批量导入区域 -->
            <div class="card mb-5">
                <h3 class="font-bold mb-2">批量导入排班</h3>
                <p class="text-textSub text-xs mb-2">格式示例：ABC休，从当月1号依次填充，A/B/C/休</p>
                <input id="batchInput" class="input" placeholder="输入排班字符，例如：ABC休A休B">
                <button onclick="importBatchShift()" class="btn btn-primary w-full mt-3">导入当月排班</button>
            </div>

            <!-- 选中日期编辑区：备注写在这里，页面内直接修改 -->
            <div class="card mb-5" id="cal-edit-area">
                <h3 id="cal-selected-date" class="font-bold mb-3">请选择日历日期</h3>
                <div>
                    <label class="block mb-1 font-medium">备注</label>
                    <textarea id="cal-note-input" class="input h-16 resize-none" placeholder="填写备注" oninput="saveSelectedNote()"></textarea>
                </div>
                <button onclick="clearSelectedDay()" class="btn btn-danger w-full mt-3">清空当天排班</button>
            </div>
            <button onclick="goPage('page-home')" class="btn btn-gray w-full">返回首页</button>
        </div>

        <!-- 待办事项页面（新增） -->
        <div id="page-todo" class="page">
            <div class="card mb-5">
                <h2 class="font-bold mb-4"><i class="bi bi-list-task"></i> 待办事项</h2>
                <div class="flex gap-2">
                    <input id="todoInput" class="input flex-1" placeholder="输入新事项">
                    <button onclick="addTodo()" class="btn btn-primary shrink-0">添加</button>
                </div>
                <div id="todoList" class="mt-4 space-y-3"></div>
            </div>
            <button onclick="goPage('page-home')" class="btn btn-gray w-full">返回首页</button>
        </div>

        <!-- 设置页：仅班次模板 -->
        <div id="page-setting" class="page">
            <div class="card mb-5">
                <h2 class="text-textSub text-sm mb-3"><i class="bi bi-clock"></i>自定义班次模板</h2>
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="new-shift-name" class="input" placeholder="班次名称，如A班">
                        <input id="new-shift-time" class="input" placeholder="时间段 07:00-15:30">
                    </div>
                    <button onclick="addShiftTemplate()" class="btn btn-primary w-full">添加班次模板</button>
                    <div id="shift-template-list" class="space-y-2 max-h-48 overflow-auto"></div>
                </div>
            </div>
            <button onclick="goPage('page-home')" class="btn btn-gray w-full">返回首页</button>
        </div>
    </div>

    <!-- 底部导航：移除录入，改为首页｜日历｜待办｜设置 -->
    <div class="fixed bottom-0 left-0 right-0 bg-bgCard shadow-lg border-t border-bgGray z-40">
        <div class="max-w-xl mx-auto grid grid-cols-4">
            <div onclick="goPage('page-home')" class="nav-item" data-target="page-home">
                <i class="bi bi-house-fill text-xl"></i><span class="text-xs mt-1">首页</span>
            </div>
            <div onclick="goPage('page-calendar')" class="nav-item" data-target="page-calendar">
                <i class="bi bi-calendar3 text-xl"></i><span class="text-xs mt-1">日历</span>
            </div>
            <div onclick="goPage('page-todo')" class="nav-item" data-target="page-todo">
                <i class="bi bi-list-task text-xl"></i><span class="text-xs mt-1">待办</span>
            </div>
            <div onclick="goPage('page-setting')" class="nav-item" data-target="page-setting">
                <i class="bi bi-gear text-xl"></i><span class="text-xs mt-1">设置</span>
            </div>
        </div>
    </div>

    <script>
        let currentMonth = new Date();
        let countdownTimer = null;
        let selectedDate = null; // 当前选中的日期

        const defaultStore = {
            shiftList:{},
            shiftTemplates:[
                {key:'A',name:'A班',time:'07:00-15:30'},
                {key:'B',name:'B班',time:'15:00-23:30'},
                {key:'C',name:'C班',time:'23:00-07:30'},
                {key:'休',name:'休息',time:'休息'}
            ]
        };

        //===== 排班存储 =====
        function getStore(){
            const raw = localStorage.getItem("shift-data");
            if(!raw) return JSON.parse(JSON.stringify(defaultStore));
            const data = JSON.parse(raw);
            if(!data.shiftTemplates) data.shiftTemplates = defaultStore.shiftTemplates;
            return data;
        }
        function saveStore(data){
            localStorage.setItem("shift-data", JSON.stringify(data));
        }

        //===== 待办事项存储 =====
        function getTodoList(){
            const raw = localStorage.getItem("todo-list");
            if(!raw) return [];
            return JSON.parse(raw);
        }
        function saveTodoList(list){
            localStorage.setItem("todo-list", JSON.stringify(list));
        }

        //解析班次时间
        function parseShiftTime(timeStr){
            if(!timeStr || timeStr === "休息") return null;
            const arr = timeStr.split("-");
            if(arr.length!==2) return null;
            return {start:arr[0].trim(), end:arr[1].trim()};
        }

        //班次倒计时
        function renderCountdown(){
            const store = getStore();
            const todayStr = new Date().toISOString().split('T')[0];
            const todayShift = store.shiftList[todayStr] || {shift:'休'};
            const shiftItem = store.shiftTemplates.find(s=>s.key === todayShift.shift);
            const cdDom = document.getElementById("shift-countdown");
            if(!shiftItem || shiftItem.time === "休息"){
                cdDom.innerText = "今日休息，无班次计时";
                cdDom.className = "mt-3 text-lg font-medium text-textSub";
                return;
            }
            const timeInfo = parseShiftTime(shiftItem.time);
            if(!timeInfo){
                cdDom.innerText = "班次时间格式错误";
                cdDom.className = "mt-3 text-lg font-medium text-danger";
                return;
            }
            const now = new Date();
            const [startH,startM] = timeInfo.start.split(":").map(Number);
            const [endH,endM] = timeInfo.end.split(":").map(Number);
            let shiftStart = new Date();
            shiftStart.setHours(startH,startM,0,0);
            let shiftEnd = new Date();
            shiftEnd.setHours(endH,endM,0,0);
            if(shiftEnd < shiftStart) shiftEnd.setDate(shiftEnd.getDate()+1);
            let diff;
            if(now < shiftStart){
                diff = shiftStart - now;
                const h = Math.floor(diff/(1000*60*60));
                const m = Math.floor((diff % (1000*60*60))/(1000*60));
                const s = Math.floor((diff % (1000*60))/1000);
                cdDom.innerText = `距离班次开始：${h}时${m}分${s}秒`;
                cdDom.className = "mt-3 text-lg font-medium text-warning";
            }else if(now < shiftEnd){
                diff = shiftEnd - now;
                const h = Math.floor(diff/(1000*60*60));
                const m = Math.floor((diff % (1000*60*60))/(1000*60));
                const s = Math.floor((diff % (1000*60))/1000);
                cdDom.innerText = `距离班次结束：${h}时${m}分${s}秒`;
                cdDom.className = "mt-3 text-lg font-medium text-primary";
            }else{
                cdDom.innerText = "✅ 今日班次已结束，请注意次日班次！";
                cdDom.className = "mt-3 text-lg font-medium text-success";
            }
        }

        //页面切换
        function goPage(pageId){
            document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
            document.getElementById(pageId).classList.add("active");
            document.querySelectorAll('.nav-item').forEach(item=>{
                item.classList.toggle('active', item.dataset.target === pageId);
            })
            if(countdownTimer) clearInterval(countdownTimer);
            if(pageId === 'page-home') {
                renderHome();
                countdownTimer = setInterval(renderCountdown,1000);
            }
            if(pageId === 'page-calendar') {
                selectedDate = null;
                document.getElementById("cal-selected-date").innerText = "请选择日历日期";
                document.getElementById("cal-note-input").value = "";
                renderCalendar();
            }
            if(pageId === 'page-todo') renderTodoPage();
            if(pageId === 'page-setting') renderSetting();
        }

        //首页渲染
        function renderHome(){
            const store = getStore();
            const todayStr = new Date().toISOString().split('T')[0];
            const todayShift = store.shiftList[todayStr] || {shift:'休', note:''};
            const shiftItem = store.shiftTemplates.find(s=>s.key === todayShift.shift) || {name:'休息',time:''};
            document.getElementById('today-shift').innerText = todayShift.shift === '休' ? "今日休息" : `今日班次：${shiftItem.name}`;
            document.getElementById('shift-time').innerText = shiftItem.time;
            document.getElementById("today-note").innerText = todayShift.note ? `备注：${todayShift.note}` : '';

            //次日班次
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate()+1);
            const tomorrowStr = tomorrow.toISOString().split('T')[0];
            const tomorrowShift = store.shiftList[tomorrowStr] || {shift:'休'};
            const tomorrowItem = store.shiftTemplates.find(s=>s.key === tomorrowShift.shift) || {name:'休息',time:''};
            document.getElementById("tomorrow-shift").innerText = tomorrowShift.shift === '休' ? "明日休息" : `明日班次：${tomorrowItem.name}`;
            document.getElementById("tomorrow-shift-time").innerText = tomorrowItem.time;
        }

        //日历
        function changeMonth(delta){
            currentMonth.setMonth(currentMonth.getMonth()+delta);
            renderCalendar();
        }
        function renderCalendar(){
            const store = getStore();
            const y = currentMonth.getFullYear();
            const m = currentMonth.getMonth();
            document.getElementById("cal-title").innerText = `${y}年${m+1}月`;
            const firstDay = new Date(y,m,1).getDay() ||7;
            const totalDay = new Date(y,m+1,0).getDate();
            let html = '';
            for(let i=1;i<firstDay;i++) html += '<div></div>';
            for(let d=1;d<=totalDay;d++){
                const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const sd = store.shiftList[ds];
                const isToday = new Date().toDateString() === new Date(y,m,d).toDateString();
                const isSelected = selectedDate === ds;
                let cls = 'day-cell';
                if(isToday) cls += ' bg-primary text-white';
                else if(sd){
                    if(sd.shift === '休') cls += ' bg-bgGray text-textSub';
                    else cls += ' bg-sky-100 text-primary';
                }else cls += ' bg-bgGray/50 text-textSub';
                if(isSelected) cls += ' day-cell-selected';

                //【UI调整】下拉框统一风格，和页面input样式一致
                if(isSelected){
                    let selHtml = `<select class="bg-bgGray rounded-lg text-xs p-1 w-full border-0 outline-none" onclick="event.stopPropagation()" onchange="changeDayShift('${ds}',this.value)">`;
                    store.shiftTemplates.forEach(t=>{
                        selHtml += `<option value="${t.key}" ${sd && sd.shift === t.key ? 'selected' : ''}>${t.name}</option>`;
                    })
                    selHtml += `</select>`;
                    html += `<div class="${cls}" onclick="selectDate('${ds}',event)">${d}<br>${selHtml}</div>`;
                }else{
                    const shiftName = sd ? store.shiftTemplates.find(t=>t.key===sd.shift)?.name || sd.shift : "";
                    html += `<div class="${cls}" onclick="selectDate('${ds}',event)">${d}<br><span class="text-xs">${shiftName}</span></div>`;
                }
            }
            document.getElementById("cal-grid").innerHTML = html;
        }

        //选中日期
        function selectDate(ds, e){
            e.stopPropagation();
            selectedDate = ds;
            const store = getStore();
            const data = store.shiftList[ds] || {shift:'休', note:''};
            document.getElementById("cal-selected-date").innerText = `选中日期：${ds}`;
            document.getElementById("cal-note-input").value = data.note || "";
            renderCalendar();
        }

        //修改班次，自动保存，修改后保留选中状态
        function changeDayShift(dateStr, shiftKey){
            const store = getStore();
            const oldData = store.shiftList[dateStr] || {note:""};
            store.shiftList[dateStr] = {shift: shiftKey, note: oldData.note};
            saveStore(store);
            selectedDate = dateStr;
            renderCalendar();
        }

        //保存选中日期的备注
        function saveSelectedNote(){
            if(!selectedDate) return;
            const store = getStore();
            const noteVal = document.getElementById("cal-note-input").value.trim();
            const oldData = store.shiftList[selectedDate] || {shift:'休'};
            store.shiftList[selectedDate] = {shift: oldData.shift, note: noteVal};
            saveStore(store);
        }

        //清空当天排班
        function clearSelectedDay(){
            if(!selectedDate) return;
            const store = getStore();
            delete store.shiftList[selectedDate];
            saveStore(store);
            document.getElementById("cal-note-input").value = "";
            renderCalendar();
        }

        //===== 批量导入排班 =====
        function importBatchShift(){
            const inputText = document.getElementById("batchInput").value.trim();
            if(!inputText) return;
            const store = getStore();
            const y = currentMonth.getFullYear();
            const m = currentMonth.getMonth();
            const totalDay = new Date(y,m+1,0).getDate();
            for(let i=0; i<inputText.length; i++){
                const dayNum = i+1;
                if(dayNum > totalDay) break;
                const char = inputText[i];
                const matchShift = store.shiftTemplates.find(t=> t.key === char);
                if(!matchShift) continue;
                const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                const oldItem = store.shiftList[dateStr] || {note:""};
                store.shiftList[dateStr] = {shift: char, note: oldItem.note};
            }
            saveStore(store);
            renderCalendar();
            document.getElementById("batchInput").value = "";
        }

        //===== 待办事项函数 =====
        function renderTodoPage(){
            const list = getTodoList();
            const wrap = document.getElementById("todoList");
            wrap.innerHTML = "";
            list.forEach((item, idx)=>{
                const lineClass = item.done ? "todo-line" : "";
                wrap.innerHTML += `
                <div class="flex items-center gap-2 bg-bgGray p-3 rounded-lg">
                    <input type="checkbox" class="w-5 h-5" ${item.done?"checked":""} onchange="toggleTodo(${idx})">
                    <span class="flex-1 ${lineClass}">${escapeHtml(item.text)}</span>
                    <button onclick="delTodo(${idx})" class="text-danger"><i class="bi bi-trash"></i></button>
                </div>`;
            })
        }
        function escapeHtml(str){
            return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        }
        function addTodo(){
            const inp = document.getElementById("todoInput");
            const txt = inp.value.trim();
            if(!txt) return;
            const list = getTodoList();
            list.push({text:txt, done:false});
            saveTodoList(list);
            inp.value = "";
            renderTodoPage();
        }
        function toggleTodo(index){
            const list = getTodoList();
            list[index].done = !list[index].done;
            saveTodoList(list);
            renderTodoPage();
        }
        function delTodo(index){
            const list = getTodoList();
            list.splice(index,1);
            saveTodoList(list);
            renderTodoPage();
        }

        //设置页班次模板
        function renderSetting(){
            const store = getStore();
            let shiftHtml = "";
            store.shiftTemplates.forEach((item,idx)=>{
                shiftHtml += `
                <div class="flex justify-between items-center bg-bgGray p-2 rounded-lg">
                    <div>${item.name} ${item.time}</div>
                    <button onclick="delShiftTemplate(${idx})" class="text-danger"><i class="bi bi-x-circle"></i></button>
                </div>`;
            })
            document.getElementById("shift-template-list").innerHTML = shiftHtml;
        }
        function addShiftTemplate(){
            const name = document.getElementById("new-shift-name").value.trim();
            const time = document.getElementById("new-shift-time").value.trim();
            if(!name) return alert("填写班次名称");
            const store = getStore();
            const newKey = Date.now().toString(36);
            store.shiftTemplates.push({key:newKey,name,time});
            saveStore(store);
            renderSetting();
            renderCalendar();
            document.getElementById("new-shift-name").value = "";
            document.getElementById("new-shift-time").value = "";
        }
        function delShiftTemplate(idx){
            if(!confirm("确定删除该班次模板？已有排班使用该班次会显示名称异常")) return;
            const store = getStore();
            store.shiftTemplates.splice(idx,1);
            saveStore(store);
            renderSetting();
            renderCalendar();
        }

        window.onload = function(){
            renderHome();
            countdownTimer = setInterval(renderCountdown,1000);
            document.querySelector(`.nav-item[data-target="page-home"]`).classList.add('active');
        }
    </script>
</body>
</html>
