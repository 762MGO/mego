<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>交接班</title>
<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --text-3: #8e8e93;
  --text-4: #c7c7cc;
  --blue: #007aff;
  --green: #34c759;
  --red: #ff3b30;
  --orange: #ff9500;
  --sep: rgba(60, 60, 67, 0.12);
  --fill: rgba(120, 120, 128, 0.12);
  --fill-2: rgba(120, 120, 128, 0.18);
  --radius: 12px;
  --radius-lg: 14px;
  --gutter: 16px;
  --max-w: 720px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--gutter);
  padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
  min-height: 100dvh;
}

@media (max-width: 640px) {
  :root { --gutter: 14px; --max-w: 100%; }
  body { font-size: 15.5px; }
}

@media (max-width: 380px) {
  :root { --gutter: 12px; }
  body { font-size: 15px; }
}

@media (min-width: 900px) {
  :root { --max-w: 760px; }
  body { background: #ebeef3; }
  .app {
    background: var(--bg);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.03);
  }
}

.hidden { display: none !important; }

/* ============ 头部 ============ */
.header {
  padding: calc(18px + env(safe-area-inset-top, 0px)) 0 10px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 30;
  margin: 0 calc(-1 * var(--gutter));
  padding-left: var(--gutter);
  padding-right: var(--gutter);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  min-height: 34px;
  gap: 8px;
}

h1 {
  font-size: clamp(24px, 6.4vw, 30px);
  font-weight: 700;
  letter-spacing: -0.6px;
  line-height: 1.1;
}

.header-title {
  font-size: clamp(15px, 4.4vw, 17px);
  font-weight: 600;
  letter-spacing: -0.2px;
  flex: 1;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--fill);
  color: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
  transition: background 0.15s, transform 0.12s;
}

.icon-btn:hover { background: var(--fill-2); }
.icon-btn:active { transform: scale(0.9); }

.date-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 10px;
}

.nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
  transition: background 0.15s, color 0.15s, transform 0.12s;
}

.nav-btn:hover { background: var(--fill); color: var(--text); }
.nav-btn:active { transform: scale(0.88); }

.date-btn {
  flex: 1;
  min-width: 0;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: clamp(15px, 4.2vw, 17px);
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  padding: 4px 6px;
  text-align: left;
  letter-spacing: -0.2px;
  transition: opacity 0.15s;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.date-btn:active { opacity: 0.5; }

.today-btn {
  border: none;
  background: rgba(0, 122, 255, 0.1);
  color: var(--blue);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.12s;
  white-space: nowrap;
}

.today-btn:hover { background: rgba(0, 122, 255, 0.16); }
.today-btn:active { transform: scale(0.94); }

/* ============ 搜索 ============ */
.search-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--fill);
  border-radius: 10px;
  padding: 8px 12px;
  transition: background 0.15s, box-shadow 0.15s, border-color 0.15s;
  border: 1.5px solid transparent;
}

.search-wrap:focus-within {
  background: var(--card);
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
  border-color: rgba(0, 122, 255, 0.3);
}

.search-wrap.active {
  background: var(--card);
  border-color: rgba(0, 122, 255, 0.4);
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
}

.search-icon { color: var(--text-3); flex-shrink: 0; transition: color 0.15s; }
.search-wrap:focus-within .search-icon,
.search-wrap.active .search-icon { color: var(--blue); }

#searchInput {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 16px;
  color: var(--text);
}

#searchInput::placeholder { color: var(--text-3); }

.search-kbd {
  font-size: 11px;
  color: var(--text-4);
  background: rgba(120, 120, 128, 0.1);
  border-radius: 4px;
  padding: 2px 5px;
  font-weight: 600;
  flex-shrink: 0;
  transition: opacity 0.15s;
  letter-spacing: 0.3px;
}

.search-wrap:focus-within .search-kbd,
.search-wrap.active .search-kbd { display: none; }

.clear-btn {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-4);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  transition: color 0.15s, transform 0.12s;
}

.clear-btn:hover { color: var(--text-3); }
.clear-btn:active { transform: scale(0.88); }

.search-status {
  margin-top: 8px;
  padding: 8px 14px;
  background: rgba(0, 122, 255, 0.08);
  border-radius: 10px;
  font-size: 13px;
  color: var(--blue);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  animation: fadeIn 0.18s ease;
}

.search-status b { font-weight: 700; }

.search-status .clear-inline {
  margin-left: auto;
  border: none;
  background: transparent;
  color: var(--blue);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  transition: background 0.15s;
}

.search-status .clear-inline:hover {
  background: rgba(0, 122, 255, 0.14);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: translateY(0); }
}

mark {
  background: rgba(255, 214, 10, 0.45);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
  font-weight: 600;
}

/* ============ 主体 ============ */
.main { padding-top: 2px; }

.composer {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 4px 4px 4px 14px;
  margin-bottom: 22px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  transition: box-shadow 0.2s;
}

.composer:focus-within {
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12),
    0 4px 16px rgba(0, 0, 0, 0.04);
}

#quickInput {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 16px;
  color: var(--text);
  padding: 9px 0;
}

#quickInput::placeholder { color: var(--text-3); }

.add-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--blue);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
  transition: background 0.2s, opacity 0.2s, transform 0.15s;
}

.add-btn:disabled {
  background: var(--text-4);
  opacity: 0.5;
  cursor: default;
}

.add-btn:not(:disabled):active { transform: scale(0.86); }

.section { margin-bottom: 22px; }

.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px 8px;
  width: 100%;
  background: transparent;
  border: none;
  font-family: inherit;
  cursor: default;
}

.section-head.collapsible {
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s;
  padding: 8px 4px;
  margin-bottom: 2px;
}

.section-head.collapsible:hover { background: var(--fill); }

.section-head h2 {
  font-size: clamp(17px, 5vw, 19px);
  font-weight: 700;
  letter-spacing: -0.4px;
  color: var(--text);
}

.section-head .count {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-3);
  background: var(--fill);
  border-radius: 10px;
  padding: 2px 9px;
  min-width: 22px;
  text-align: center;
  transition: background 0.2s, color 0.2s;
}

.section-head .count.active {
  background: rgba(0, 122, 255, 0.14);
  color: var(--blue);
}

.section-head .chev {
  margin-left: auto;
  color: var(--text-4);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
}

.section-head .chev.open { transform: rotate(90deg); }

/* ============ 分组卡片 ============ */
.group-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.group-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  transition: box-shadow 0.2s;
}

.group-card:hover {
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 14px rgba(0, 0, 0, 0.05);
}

.group-card.match-highlight {
  box-shadow: 0 0 0 1.5px rgba(0, 122, 255, 0.3),
    0 1px 2px rgba(0, 0, 0, 0.04);
}

.group-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 16px;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  transition: background 0.12s;
}

.group-head:hover { background: var(--fill); }
.group-head:active { background: var(--fill-2); }

.group-name {
  flex: 1;
  min-width: 0;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: -0.2px;
}

.group-count {
  font-size: 13.5px;
  font-weight: 600;
  border-radius: 9px;
  padding: 2px 9px;
  flex-shrink: 0;
  transition: background 0.2s, color 0.2s;
}

.group-count.blue {
  background: rgba(0, 122, 255, 0.12);
  color: var(--blue);
}

.group-count.green {
  background: rgba(52, 199, 89, 0.14);
  color: var(--green);
}

.group-chev {
  color: var(--text-4);
  flex-shrink: 0;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s;
}

.group-card.expanded .group-chev {
  transform: rotate(90deg);
  color: var(--blue);
}

.group-preview {
  padding: 0 14px 12px 26px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.preview-line {
  font-size: 13.5px;
  color: var(--text-3);
  line-height: 1.45;
  display: flex;
  align-items: baseline;
  gap: 6px;
  overflow: hidden;
}

.preview-line .dot {
  color: var(--text-4);
  flex-shrink: 0;
  font-weight: 700;
}

.preview-line .txt {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}

.preview-more {
  font-size: 12.5px;
  color: var(--text-4);
  padding-left: 12px;
  margin-top: 1px;
}

.group-expanded {
  border-top: 1px solid var(--sep);
  padding: 2px 0 6px;
  animation: expandIn 0.18s ease;
}

@keyframes expandIn {
  from { opacity: 0; transform: translateY(-3px); }
  to   { opacity: 1; transform: translateY(0); }
}

.expanded-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px 9px 26px;
  position: relative;
  transition: background 0.12s;
}

.expanded-item:not(:first-child)::before {
  content: '';
  position: absolute;
  top: 0;
  left: 26px;
  right: 0;
  height: 1px;
  background: var(--sep);
}

.expanded-item:hover { background: var(--fill); }

.expanded-text {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  line-height: 1.4;
  word-break: break-word;
  color: var(--text);
  transition: color 0.2s;
  cursor: text;
}

.expanded-text.done {
  color: var(--text-3);
  text-decoration: line-through;
  text-decoration-color: var(--text-4);
}

/* 编辑输入框 */
.edit-input {
  flex: 1;
  min-width: 0;
  border: 1.5px solid var(--blue);
  border-radius: 7px;
  padding: 3px 9px;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  background: #fff;
  color: var(--text);
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.14);
  line-height: 1.4;
  -webkit-appearance: none;
}

.modal-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--text-4);
  background: transparent;
  flex-shrink: 0;
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: background 0.22s, border-color 0.22s, transform 0.12s;
}

.modal-check:hover { border-color: var(--blue); }
.modal-check:active { transform: scale(0.85); }

.modal-check.checked {
  background: var(--blue);
  border-color: var(--blue);
}

.modal-check.checked::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4.5px;
  height: 9px;
  border: 2px solid #fff;
  border-top: 0;
  border-left: 0;
  border-radius: 0 0 1px 0;
  transform: translate(-50%, -60%) rotate(45deg);
}

/* 操作按钮：编辑 + 删除 */
.modal-edit,
.modal-del {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-4);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s, color 0.15s, transform 0.12s;
}

.expanded-item:hover .modal-edit,
.expanded-item:hover .modal-del { opacity: 1; }

.modal-edit:hover {
  background: rgba(0, 122, 255, 0.1);
  color: var(--blue);
}

.modal-edit:active,
.modal-del:active { transform: scale(0.88); }

.modal-del:hover {
  background: rgba(255, 59, 48, 0.1);
  color: var(--red);
}

@media (hover: none) {
  .modal-edit,
  .modal-del { opacity: 1; }
}

.empty {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-3);
  font-size: 14.5px;
  background: var(--card);
  border-radius: var(--radius-lg);
}

.empty b { color: var(--text); font-weight: 600; }

/* ============ 日历 ============ */
.cal-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 12px 8px 10px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  margin-bottom: 22px;
}

.cal-head {
  display: flex;
  align-items: center;
  padding: 0 4px 10px;
}

.cal-nav {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
  transition: background 0.15s, color 0.15s, transform 0.12s;
}

.cal-nav:hover { background: var(--fill); color: var(--text); }
.cal-nav:active { transform: scale(0.88); }

.cal-title {
  flex: 1;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.2px;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}

.cal-weekday {
  text-align: center;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-3);
  padding: 4px 0 6px;
}

.cal-cell {
  position: relative;
  border: none;
  background: transparent;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 0 5px;
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.13s;
  -webkit-user-select: none;
  user-select: none;
  min-height: 42px;
}

.cal-cell:hover { background: var(--fill); }
.cal-cell:active { background: var(--fill-2); }

.cal-day {
  font-size: clamp(14px, 4.2vw, 15.5px);
  font-weight: 400;
  color: var(--text);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.cal-cell.out .cal-day { color: var(--text-4); }
.cal-cell.today .cal-day { color: var(--blue); font-weight: 700; }

.cal-cell.selected { background: var(--blue); }
.cal-cell.selected .cal-day { color: #fff; font-weight: 600; }
.cal-cell.selected .cal-dot { background: rgba(255, 255, 255, 0.9) !important; }

.cal-dots {
  display: flex;
  gap: 3px;
  height: 5px;
  align-items: center;
  justify-content: center;
}

.cal-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--blue);
}

.cal-dot.done { background: var(--text-4); }

.date-list {
  display: flex;
  flex-direction: column;
  gap: 0;
  background: var(--card);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}

.date-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  background: transparent;
  border: none;
  font-family: inherit;
  color: var(--text);
  cursor: pointer;
  position: relative;
  text-align: left;
  transition: background 0.12s;
}

.date-item:not(:first-child)::before {
  content: '';
  position: absolute;
  top: 0;
  left: 14px;
  right: 0;
  height: 1px;
  background: var(--sep);
}

.date-item:hover { background: var(--fill); }
.date-item:active { background: var(--fill-2); }
.date-item.active { background: rgba(0, 122, 255, 0.07); }

.date-item-main { flex: 1; min-width: 0; }

.date-item-label {
  font-size: 15px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.today-tag {
  font-size: 10.5px;
  font-weight: 600;
  background: var(--blue);
  color: #fff;
  border-radius: 5px;
  padding: 1.5px 6px;
  flex-shrink: 0;
}

.date-item-sub {
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: 2px;
}

.date-item-sub.has-undone { color: var(--orange); }

.date-item-chev { color: var(--text-4); flex-shrink: 0; }

#datePicker {
  position: fixed;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  width: 1px;
  height: 1px;
  opacity: 0;
  border: none;
  padding: 0;
  pointer-events: none;
  z-index: -1;
}

.view { display: block; }
.view.hidden { display: none !important; }

button:focus-visible {
  outline: 2px solid rgba(0, 122, 255, 0.5);
  outline-offset: 2px;
}

input:focus-visible {
  outline: none;
}
</style>

               viewBox="0 0 12 12" fill="none">

  <!-- ==================== 日历页 ==================== -->
  <div id="viewCalendar" class="view hidden">

          <svg width="11" height="11" viewBox="0 0 12 12" fill="none">

                  stroke-linecap="round" stroke-linejoin="round"/>

    <main class="main">
      <div class="cal-card">
        <div class="cal-head">
          <button class="cal-nav" id="calPrev" aria-label="上个月" type="button">

                    stroke-linecap="round" stroke-linejoin="round"/>

            <svg width="11" height="11" viewBox="0 0 12 12" fill="none">

      </section>

</div>

<input type="date" id="datePicker">

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'hotel_front_memo_v9';
  var BACKUP_KEY = 'hotel_front_memo_v9_backup';

  /* ==================================================
     状态
  ================================================== */
  var records = {};
  var currentDate = todayStr();
  var searchQuery = '';
  var doneExpanded = false;
  var expandedGroups = {};

  var calYear = 0;
  var calMonth = 0;

  /* ==================================================
     工具
  ================================================== */
  function $(sel) { return document.querySelector(sel); }

  function todayStr(d) {
    d = d || new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function fmtDate(y, m, d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return y + '-' + p(m + 1) + '-' + p(d);
  }

  function shiftDateStr(dateStr, n) {
    var p = dateStr.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2] + n);
    return todayStr(dt);
  }

  function fmtDateLabel(dateStr) {
    var p = dateStr.split('-');
    var today = todayStr();
    if (dateStr === today) return '今天 · ' + (+p[1]) + '月' + (+p[2]) + '日';
    if (dateStr === shiftDateStr(today, -1)) return '昨天 · ' + (+p[1]) + '月' + (+p[2]) + '日';
    if (dateStr === shiftDateStr(today, 1)) return '明天 · ' + (+p[1]) + '月' + (+p[2]) + '日';
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var wd = ['日', '一', '二', '三', '四', '五', '六'][dt.getDay()];
    return (+p[1]) + '月' + (+p[2]) + '日 周' + wd;
  }

  function fmtDateFull(dateStr) {
    var p = dateStr.split('-');
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var wd = ['日', '一', '二', '三', '四', '五', '六'][dt.getDay()];
    return (+p[0]) + '年' + (+p[1]) + '月' + (+p[2]) + '日 周' + wd;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fuzzyMatch(text, query) {
    if (!query) return true;
    var t = String(text).toLowerCase();
    var q = String(query).toLowerCase();
    if (t.indexOf(q) !== -1) return true;
    var ti = 0;
    for (var i = 0; i < q.length; i++) {
      var idx = t.indexOf(q[i], ti);
      if (idx === -1) return false;
      ti = idx + 1;
    }
    return true;
  }

  function highlight(text, query) {
    var str = String(text == null ? '' : text);
    if (!query) return esc(str);
    var lowerText = str.toLowerCase();
    var lowerQuery = String(query).toLowerCase();
    if (!lowerQuery) return esc(str);

    var idx = lowerText.indexOf(lowerQuery);
    if (idx !== -1) {
      var end = idx + lowerQuery.length;
      return esc(str.slice(0, idx)) +
        '<mark>' + esc(str.slice(idx, end)) + '</mark>' +
        esc(str.slice(end));
    }

    var out = '';
    var ti = 0;
    for (var i = 0; i < str.length; i++) {
      if (ti < lowerQuery.length && lowerText.charAt(i) === lowerQuery.charAt(ti)) {
        out += '<mark>' + esc(str.charAt(i)) + '</mark>';
        ti++;
      } else {
        out += esc(str.charAt(i));
      }
    }
    return out;
  }

  function groupKey(text) {
    var t = String(text).trim();
    if (!t) return '其他';
    var m = t.match(/^(\d{3,4})/);
    if (m) return m[1] + '房';
    var first = t.split(/[\s，,。.、；;：:！!？?]+/)[0];
    if (!first) return '其他';
    if (first.length <= 6) return first;
    return first.slice(0, 6);
  }

  var CHEV_SVG = '<svg class="group-chev" width="12" height="12" viewBox="0 0 12 12" fill="none">' +
    '<path d="M4.5 2L8.5 6L4.5 10" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var DEL_SVG = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none">' +
    '<path d="M2.5 2.5L9.5 9.5M9.5 2.5L2.5 9.5" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round"/></svg>';

  var EDIT_SVG = '<svg width="13" height="13" viewBox="0 0 14 14" fill="none">' +
    '<path d="M9.5 2L12 4.5L5 11.5L2 12L2.5 9L9.5 2Z" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<path d="M8 3.5L10.5 6" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round"/></svg>';

  /* ==================================================
     本地存储（增强稳定版）
  ================================================== */

  /* 数据校验和清洗 */
  function validateRecords(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) return {};
    var cleaned = {};
    Object.keys(data).forEach(function (d) {
      /* 只接受 YYYY-MM-DD 格式 */
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;

      var arr = data[d];
      if (!Array.isArray(arr)) return;

      var validTasks = [];
      var seenIds = {};

      arr.forEach(function (t) {
        if (!t || typeof t !== 'object') return;
        if (typeof t.id !== 'string' || !t.id) return;
        if (typeof t.text !== 'string' || !t.text.trim()) return;
        /* 防止 ID 重复 */
        if (seenIds[t.id]) return;
        seenIds[t.id] = true;

        validTasks.push({
          id: t.id,
          text: String(t.text).trim().slice(0, 120),
          done: !!t.done,
          createdAt: typeof t.createdAt === 'number' && isFinite(t.createdAt)
            ? t.createdAt : Date.now(),
          doneAt: typeof t.doneAt === 'number' && isFinite(t.doneAt)
            ? t.doneAt : null
        });
      });

      if (validTasks.length > 0) cleaned[d] = validTasks;
    });
    return cleaned;
  }

  /* 保存：先写主存储，成功后同步备份 */
  function save() {
    var json;
    try {
      json = JSON.stringify(records);
    } catch (e) {
      console.warn('序列化失败', e);
      return false;
    }

    var ok = false;

    /* 主存储 */
    try {
      localStorage.setItem(STORAGE_KEY, json);
      ok = true;
    } catch (e) {
      console.warn('主存储写入失败', e);
      /* 尝试清理 180 天前的数据 */
      try {
        var cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 180);
        var cutoffStr = todayStr(cutoff);
        var cleaned = false;
        Object.keys(records).forEach(function (d) {
          if (d < cutoffStr) {
            delete records[d];
            cleaned = true;
          }
        });
        if (cleaned) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
          ok = true;
          console.info('已自动清理 180 天前的数据以释放空间');
        }
      } catch (e2) {
        console.warn('清理后仍写入失败', e2);
      }
    }

    /* 备份存储（不影响主流程） */
    if (ok) {
      try {
        localStorage.setItem(BACKUP_KEY, json);
      } catch (e) {
        /* 备份失败不报错 */
      }
    }

    return ok;
  }

  /* 加载：优先主存储，失败则从备份恢复 */
  function load() {
    var raw = null;

    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      console.warn('读取主存储失败', e);
    }

    /* 主存储为空或损坏时尝试备份 */
    if (!raw) {
      try {
        var backup = localStorage.getItem(BACKUP_KEY);
        if (backup) {
          console.info('从备份恢复数据');
          raw = backup;
        }
      } catch (e) { /* 忽略 */ }
    }

    if (raw) {
      try {
        var data = JSON.parse(raw);
        var cleaned = validateRecords(data);

        /* 检测到数据被清洗（可能损坏），写回主存储 */
        var originalKeys = Object.keys(data || {}).length;
        var cleanedKeys = Object.keys(cleaned).length;
        var hadInvalid = false;
        if (originalKeys !== cleanedKeys) hadInvalid = true;
        else {
          /* 逐日校验任务数量 */
          for (var d in cleaned) {
            if (Array.isArray(data[d]) && data[d].length !== cleaned[d].length) {
              hadInvalid = true;
              break;
            }
          }
        }

        records = cleaned;
        if (hadInvalid) {
          console.info('检测到部分数据异常，已自动修复');
          save();
        }
      } catch (e) {
        console.warn('数据解析失败，重置为空', e);
        records = {};
      }
    } else {
      records = {};
    }

    /* 跨天自动回到今天 */
    if (currentDate < todayStr()) currentDate = todayStr();
  }

  function tasksFor(date) {
    date = date || currentDate;
    var arr = records[date];
    return Array.isArray(arr) ? arr : [];
  }

  function ensureTasks() {
    if (!Array.isArray(records[currentDate])) records[currentDate] = [];
    return records[currentDate];
  }

  function cleanupEmpty() {
    var changed = false;
    Object.keys(records).forEach(function (d) {
      if (!Array.isArray(records[d]) || records[d].length === 0) {
        delete records[d];
        changed = true;
      }
    });
    return changed;
  }

  /* ==================================================
     任务操作
  ================================================== */
  function addTask(text) {
    text = String(text).trim();
    if (!text) return false;
    ensureTasks().push({
      id: uid(),
      text: text.slice(0, 120),
      done: false,
      createdAt: Date.now(),
      doneAt: null
    });
    save();
    return true;
  }

  function toggleTask(id) {
    var arr = tasksFor();
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) {
        arr[i].done = !arr[i].done;
        arr[i].doneAt = arr[i].done ? Date.now() : null;
        save();
        return true;
      }
    }
    return false;
  }

  function removeTask(id) {
    var arr = tasksFor();
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) {
        arr.splice(i, 1);
        cleanupEmpty();
        save();
        return true;
      }
    }
    return false;
  }

  /* 编辑任务文本 */
  function updateTaskText(id, newText) {
    newText = String(newText).trim();
    if (!newText) return false;

    var arr = tasksFor();
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) {
        arr[i].text = newText.slice(0, 120);
        save();
        return true;
      }
    }
    return false;
  }

  /* ==================================================
     编辑交互
  ================================================== */
  function startEdit(id) {
    var arr = tasksFor();
    var task = null;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) { task = arr[i]; break; }
    }
    if (!task) return;

    var item = document.querySelector('.expanded-item[data-id="' + id + '"]');
    if (!item) return;

    var textEl = item.querySelector('.expanded-text');
    if (!textEl) return;
    /* 已经在编辑状态则忽略 */
    if (item.querySelector('.edit-input')) return;

    var original = task.text;

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'edit-input';
    input.value = original;
    input.maxLength = 120;
    input.setAttribute('enterkeyhint', 'done');
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('spellcheck', 'false');

    textEl.replaceWith(input);

    /* 聚焦并全选 */
    setTimeout(function () {
      input.focus();
      try { input.setSelectionRange(0, input.value.length); } catch (e) {}
    }, 0);

    var finished = false;

    function finish(saveIt) {
      if (finished) return;
      finished = true;

      if (saveIt) {
        var v = input.value.trim();
        if (v && v !== original) {
          updateTaskText(id, v);
        }
      }
      renderHome();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        finish(true);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        finish(false);
      }
    });

    input.addEventListener('blur', function () {
      finish(true);
    });

    /* 阻止点击输入框时冒泡到卡片 */
    input.addEventListener('click', function (e) {
      e.stopPropagation();
    });
    input.addEventListener('mousedown', function (e) {
      e.stopPropagation();
    });
    input.addEventListener('touchstart', function (e) {
      e.stopPropagation();
    });
  }

  /* ==================================================
     分组
  ================================================== */
  function buildGroups(tasks) {
    var map = new Map();
    tasks.forEach(function (t) {
      var k = groupKey(t.text);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(t);
    });
    var list = Array.from(map.entries());
    list.sort(function (a, b) {
      var aLast = 0, bLast = 0;
      a[1].forEach(function (t) {
        if (t.createdAt > aLast) aLast = t.createdAt;
        if (t.doneAt > aLast) aLast = t.doneAt;
      });
      b[1].forEach(function (t) {
        if (t.createdAt > bLast) bLast = t.createdAt;
        if (t.doneAt > bLast) bLast = t.doneAt;
      });
      return bLast - aLast;
    });
    return list;
  }

  /* ==================================================
     渲染分组卡片
  ================================================== */
  function renderGroupCard(key, items, mode, forceExpand) {
    var isDone = mode === 'done';
    var expandKey = mode + ':' + key;
    var isExpanded = forceExpand || !!expandedGroups[expandKey];
    var cls = 'group-card' + (isExpanded ? ' expanded' : '');
    var countCls = isDone ? 'green' : 'blue';
    var q = searchQuery.trim();

    var nameMatch = q && fuzzyMatch(key, q);
    if (nameMatch) cls += ' match-highlight';

    var nameHTML = q ? highlight(key, q) : esc(key);

    var bodyHTML;

    if (isExpanded) {
      var sorted = items.slice().sort(function (a, b) {
        if (isDone) return (b.doneAt || 0) - (a.doneAt || 0);
        return a.createdAt - b.createdAt;
      });

      bodyHTML = '<div class="group-expanded">' +
        sorted.map(function (t) {
          var textHTML = q ? highlight(t.text, q) : esc(t.text);
          return '<div class="expanded-item" data-id="' + t.id + '">' +
            '<button class="modal-check' + (t.done ? ' checked' : '') +
              '" data-action="toggle" type="button" aria-label="切换完成"></button>' +
            '<span class="expanded-text' + (t.done ? ' done' : '') + '">' +
              textHTML + '</span>' +
            '<button class="modal-edit" data-action="edit" type="button" aria-label="编辑">' +
              EDIT_SVG + '</button>' +
            '<button class="modal-del" data-action="delete" type="button" aria-label="删除">' +
              DEL_SVG + '</button>' +
          '</div>';
        }).join('') +
      '</div>';
    } else {
      var preview = items.slice(0, 2);
      var remain = items.length - preview.length;

      bodyHTML = '<div class="group-preview">' +
        preview.map(function (t) {
          var textHTML = q ? highlight(t.text, q) : esc(t.text);
          return '<div class="preview-line">' +
            '<span class="dot">·</span>' +
            '<span class="txt">' + textHTML + '</span>' +
          '</div>';
        }).join('') +
        (remain > 0
          ? '<div class="preview-more">还有 ' + remain + ' 条…</div>'
          : '') +
      '</div>';
    }

    return '<div class="' + cls + '" data-key="' + esc(key) + '">' +
      '<button class="group-head" type="button">' +
        '<span class="group-name">' + nameHTML + '</span>' +
        '<span class="group-count ' + countCls + '">' + items.length + '</span>' +
        CHEV_SVG +
      '</button>' +
      bodyHTML +
    '</div>';
  }

  /* ==================================================
     渲染：首页
  ================================================== */
  function renderHome() {
    var all = tasksFor();
    var q = searchQuery.trim();

    $('#dateLabel').textContent = fmtDateLabel(currentDate);
    $('#todayBtn').classList.toggle('hidden', currentDate === todayStr());

    var searchWrap = $('#searchWrap');
    if (searchWrap) searchWrap.classList.toggle('active', !!q);

    /* ---- 待办 ---- */
    var undone = all.filter(function (t) { return !t.done; });
    var groups = buildGroups(undone);

    if (q) {
      var filtered = [];
      groups.forEach(function (pair) {
        var key = pair[0], items = pair[1];
        var keyHit = fuzzyMatch(key, q);
        var matchedItems = keyHit ? items : items.filter(function (t) {
          return fuzzyMatch(t.text, q);
        });
        if (matchedItems.length > 0) filtered.push([key, matchedItems]);
      });
      groups = filtered;
    }

    var todoTotal = 0;
    groups.forEach(function (p) { todoTotal += p[1].length; });

    var todoCountEl = $('#todoCount');
    todoCountEl.textContent = todoTotal;
    todoCountEl.classList.toggle('active', todoTotal > 0);

    var groupList = $('#groupList');
    var forceExpand = !!q;

    if (groups.length === 0) {
      groupList.innerHTML = '<div class="empty">' +
        (q
          ? '没有匹配「<b>' + esc(q) + '</b>」的待办'
          : '暂无待办事项') +
        '</div>';
    } else {
      groupList.innerHTML = groups.map(function (pair) {
        return renderGroupCard(pair[0], pair[1], 'todo', forceExpand);
      }).join('');
    }

    /* ---- 已完成 ---- */
    var done = all.filter(function (t) { return t.done; });
    if (q) {
      done = done.filter(function (t) {
        return fuzzyMatch(t.text, q) || fuzzyMatch(groupKey(t.text), q);
      });
    }

    var doneSection = $('#doneSection');
    var doneCountEl = $('#doneCount');
    var doneListEl = $('#doneList');

    if (done.length === 0) {
      doneSection.classList.add('hidden');
      doneListEl.classList.add('hidden');
      doneListEl.innerHTML = '';
      renderSearchStatus(0, todoTotal);
      return;
    }

    doneSection.classList.remove('hidden');
    doneCountEl.textContent = done.length;
    doneCountEl.classList.toggle('active', done.length > 0);

    var doneGroups = buildGroups(done);
    doneListEl.innerHTML = doneGroups.map(function (pair) {
      return renderGroupCard(pair[0], pair[1], 'done', forceExpand);
    }).join('');

    var shouldExpandDone = q ? true : doneExpanded;
    doneListEl.classList.toggle('hidden', !shouldExpandDone);
    $('#doneChev').classList.toggle('open', shouldExpandDone);

    renderSearchStatus(done.length, todoTotal);
  }

  function renderSearchStatus(doneCount, todoCount) {
    var q = searchQuery.trim();
    var statusEl = $('#searchStatus');
    if (!statusEl) return;

    if (!q) {
      statusEl.classList.add('hidden');
      statusEl.innerHTML = '';
      return;
    }

    var total = doneCount + todoCount;
    var groupTotal = document.querySelectorAll('#groupList .group-card').length;

    var text;
    if (total === 0) {
      text = '未找到匹配「<b>' + esc(q) + '</b>」的内容';
    } else {
      text = '找到 <b>' + total + '</b> 条匹配';
      if (groupTotal > 0) {
        text += '（<b>' + groupTotal + '</b> 个合集）';
      }
      if (doneCount > 0) {
        text += ' · 含已完成 ' + doneCount + ' 条';
      }
    }

    statusEl.innerHTML =
      '<span>' + text + '</span>' +
      '<button class="clear-inline" type="button" id="statusClear">清除</button>';
    statusEl.classList.remove('hidden');

    var sc = $('#statusClear');
    if (sc) {
      sc.addEventListener('click', function () {
        clearSearch();
        renderHome();
      });
    }
  }

  /* ==================================================
     渲染：日历
  ================================================== */
  function renderCalendar() {
    var today = todayStr();
    var firstWeekday = new Date(calYear, calMonth, 1).getDay();
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    var prevMonthDays = new Date(calYear, calMonth, 0).getDate();

    var prevY = calMonth === 0 ? calYear - 1 : calYear;
    var prevM = calMonth === 0 ? 11 : calMonth - 1;
    var nextY = calMonth === 11 ? calYear + 1 : calYear;
    var nextM = calMonth === 11 ? 0 : calMonth + 1;

    $('#calTitle').textContent = calYear + '年' + (calMonth + 1) + '月';

    var html = '';
    ['日', '一', '二', '三', '四', '五', '六'].forEach(function (w) {
      html += '<div class="cal-weekday">' + w + '</div>';
    });

    for (var i = firstWeekday - 1; i >= 0; i--) {
      var d = prevMonthDays - i;
      html += calCellHTML(fmtDate(prevY, prevM, d), d, false, today);
    }

    for (var dd = 1; dd <= daysInMonth; dd++) {
      html += calCellHTML(fmtDate(calYear, calMonth, dd), dd, true, today);
    }

    var used = firstWeekday + daysInMonth;
    var totalCells = used <= 35 ? 35 : 42;
    var nextDay = 1;
    for (var j = used; j < totalCells; j++) {
      html += calCellHTML(fmtDate(nextY, nextM, nextDay), nextDay, false, today);
      nextDay++;
    }

    $('#calGrid').innerHTML = html;
  }

  function calCellHTML(dateStr, day, inMonth, today) {
    var tasks = Array.isArray(records[dateStr]) ? records[dateStr] : [];
    var undone = tasks.filter(function (t) { return !t.done; }).length;

    var cls = 'cal-cell';
    if (!inMonth) cls += ' out';
    if (dateStr === today) cls += ' today';
    if (dateStr === currentDate) cls += ' selected';

    var dotsHTML = '<span class="cal-dots">';
    if (tasks.length > 0) {
      dotsHTML += undone > 0
        ? '<i class="cal-dot"></i>'
        : '<i class="cal-dot done"></i>';
    }
    dotsHTML += '</span>';

    return '<button class="' + cls + '" data-date="' + dateStr + '" type="button">' +
      '<span class="cal-day">' + day + '</span>' +
      dotsHTML +
    '</button>';
  }

  function renderMonthList() {
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    var dates = [];
    for (var d = 1; d <= daysInMonth; d++) {
      var ds = fmtDate(calYear, calMonth, d);
      if (Array.isArray(records[ds]) && records[ds].length > 0) dates.push(ds);
    }
    dates.sort().reverse();

    $('#monthCount').textContent = dates.length;
    $('#monthCount').classList.toggle('active', dates.length > 0);

    if (dates.length === 0) {
      $('#monthList').innerHTML = '<div class="empty">本月暂无记录</div>';
      return;
    }

    var today = todayStr();

    $('#monthList').innerHTML = dates.map(function (d) {
      var tasks = records[d];
      var undone = tasks.filter(function (t) { return !t.done; }).length;
      var total = tasks.length;
      var sub = undone > 0
        ? undone + ' 项待办 · 共 ' + total + ' 项'
        : '全部完成 · 共 ' + total + ' 项';

      return '<button class="date-item' + (d === currentDate ? ' active' : '') +
        '" data-date="' + d + '" type="button">' +
        '<div class="date-item-main">' +
          '<div class="date-item-label">' + esc(fmtDateFull(d)) +
            (d === today ? '<span class="today-tag">今天</span>' : '') +
          '</div>' +
          '<div class="date-item-sub' + (undone > 0 ? ' has-undone' : '') + '">' +
            esc(sub) +
          '</div>' +
        '</div>' +
        '<svg class="date-item-chev" width="12" height="12" viewBox="0 0 12 12" fill="none">' +
          '<path d="M4.5 2L8.5 6L4.5 10" stroke="currentColor" stroke-width="1.9" ' +
            'stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>' +
      '</button>';
    }).join('');
  }

  /* ==================================================
     视图切换
  ================================================== */
  function switchView(name) {
    var home = $('#viewHome');
    var cal = $('#viewCalendar');
    if (name === 'home') {
      cal.classList.add('hidden');
      home.classList.remove('hidden');
    } else {
      home.classList.add('hidden');
      cal.classList.remove('hidden');
    }
    window.scrollTo(0, 0);
  }

  function openCalendar() {
    var p = currentDate.split('-');
    calYear = +p[0];
    calMonth = +p[1] - 1;
    renderCalendar();
    renderMonthList();
    switchView('calendar');
  }

  /* ==================================================
     快速添加
  ================================================== */
  function syncAddBtn() {
    var input = $('#quickInput');
    var btn = $('#quickAddBtn');
    if (input && btn) btn.disabled = !input.value.trim();
  }

  function doQuickAdd() {
    var input = $('#quickInput');
    if (!input) return;
    if (addTask(input.value)) {
      input.value = '';
      syncAddBtn();
      renderHome();
      input.focus();
    }
  }

  function clearSearch() {
    searchQuery = '';
    var si = $('#searchInput');
    if (si) si.value = '';
    var cb = $('#clearSearch');
    if (cb) cb.classList.add('hidden');
    var sw = $('#searchWrap');
    if (sw) sw.classList.remove('active');
  }

  /* ==================================================
     分组点击处理
  ================================================== */
  function handleGroupClick(e) {
    var target = e.target;

    /* 忽略来自编辑输入框的点击 */
    if (target && target.tagName === 'INPUT') return;
    if (target && target.classList && target.classList.contains('edit-input')) return;

    var actionBtn = target.closest ? target.closest('[data-action]') : null;

    if (actionBtn) {
      var action = actionBtn.getAttribute('data-action');
      var item = actionBtn.closest('.expanded-item');

      if (item) {
        e.preventDefault();
        e.stopPropagation();
        var id = item.getAttribute('data-id');

        if (action === 'toggle') {
          toggleTask(id);
          renderHome();
        } else if (action === 'delete') {
          item.style.transition = 'opacity .16s ease, transform .16s ease';
          item.style.opacity = '0';
          item.style.transform = 'translateX(-14px)';
          setTimeout(function () {
            removeTask(id);
            renderHome();
          }, 150);
        } else if (action === 'edit') {
          startEdit(id);
        }
        return;
      }
    }

    var card = target.closest ? target.closest('.group-card') : null;
    if (!card) return;

    e.preventDefault();

    /* 搜索状态下点击分组：清空搜索再展开 */
    if (searchQuery.trim()) {
      var key = card.getAttribute('data-key');
      var container = card.parentElement;
      var mode = (container && container.id === 'doneList') ? 'done' : 'todo';
      clearSearch();
      expandedGroups[mode + ':' + key] = true;
      renderHome();
      return;
    }

    var key2 = card.getAttribute('data-key');
    var container2 = card.parentElement;
    var mode2 = (container2 && container2.id === 'doneList') ? 'done' : 'todo';
    var expandKey = mode2 + ':' + key2;

    if (expandedGroups[expandKey]) {
      delete expandedGroups[expandKey];
    } else {
      expandedGroups[expandKey] = true;
    }
    renderHome();
  }

  /* ==================================================
     事件绑定
  ================================================== */
  function bindEvents() {

    /* ---------- 快速添加 ---------- */
    var quickInput = $('#quickInput');
    if (quickInput) {
      quickInput.addEventListener('input', syncAddBtn);
      quickInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doQuickAdd(); }
      });
    }

    var quickAddBtn = $('#quickAddBtn');
    if (quickAddBtn) quickAddBtn.addEventListener('click', doQuickAdd);

    /* ---------- 搜索 ---------- */
    var searchInput = $('#searchInput');
    var clearBtn = $('#clearSearch');

    if (searchInput) {
      searchInput.addEventListener('input', function () {
        searchQuery = searchInput.value;
        if (clearBtn) clearBtn.classList.toggle('hidden', !searchQuery);
        renderHome();
      });

      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          clearSearch();
          renderHome();
          searchInput.blur();
        }
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', function () {
        clearSearch();
        renderHome();
        if (searchInput) searchInput.focus();
      });
    }

    /* 快捷键 / 和 Ctrl/Cmd+F */
    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) || '';
      var isInput = tag === 'INPUT' || tag === 'TEXTAREA';

      if (e.key === '/' && !isInput) {
        e.preventDefault();
        if (searchInput) searchInput.focus();
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (searchInput) searchInput.focus();
      }
    });

    /* ---------- 日期导航 ---------- */
    var prevBtn = $('#prevBtn');
    if (prevBtn) {
      prevBtn.addEventListener('click', function () {
        currentDate = shiftDateStr(currentDate, -1);
        clearSearch();
        renderHome();
      });
    }

    var nextBtn = $('#nextBtn');
    if (nextBtn) {
      nextBtn.addEventListener('click', function () {
        currentDate = shiftDateStr(currentDate, 1);
        clearSearch();
        renderHome();
      });
    }

    var todayBtn = $('#todayBtn');
    if (todayBtn) {
      todayBtn.addEventListener('click', function () {
        currentDate = todayStr();
        renderHome();
      });
    }

    var dateBtn = $('#dateBtn');
    if (dateBtn) {
      dateBtn.addEventListener('click', function () {
        var picker = $('#datePicker');
        if (!picker) return;
        picker.value = currentDate;
        try {
          if (typeof picker.showPicker === 'function') picker.showPicker();
          else picker.click();
        } catch (err) { picker.click(); }
      });
    }

    var datePicker = $('#datePicker');
    if (datePicker) {
      datePicker.addEventListener('change', function (e) {
        if (e.target.value) {
          currentDate = e.target.value;
          clearSearch();
          renderHome();
        }
      });
    }

    /* ---------- 分组列表 ---------- */
    var groupList = $('#groupList');
    if (groupList) groupList.addEventListener('click', handleGroupClick);

    var doneList = $('#doneList');
    if (doneList) doneList.addEventListener('click', handleGroupClick);

    /* ---------- 已完成区块折叠 ---------- */
    var doneToggle = $('#doneToggle');
    if (doneToggle) {
      doneToggle.addEventListener('click', function () {
        if (searchQuery.trim()) {
          doneExpanded = true;
          renderHome();
          return;
        }
        doneExpanded = !doneExpanded;
        var dl = $('#doneList');
        var dc = $('#doneChev');
        if (dl) dl.classList.toggle('hidden', !doneExpanded);
        if (dc) dc.classList.toggle('open', doneExpanded);
      });
    }

    /* ---------- 日历入口 ---------- */
    var calendarBtn = $('#calendarBtn');
    if (calendarBtn) calendarBtn.addEventListener('click', openCalendar);

    var calBack = $('#calBack');
    if (calBack) {
      calBack.addEventListener('click', function () {
        switchView('home');
        renderHome();
      });
    }

    var calPrev = $('#calPrev');
    if (calPrev) {
      calPrev.addEventListener('click', function () {
        calMonth--;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendar();
        renderMonthList();
      });
    }

    var calNext = $('#calNext');
    if (calNext) {
      calNext.addEventListener('click', function () {
        calMonth++;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendar();
        renderMonthList();
      });
    }

    var calTodayBtn = $('#calTodayBtn');
    if (calTodayBtn) {
      calTodayBtn.addEventListener('click', function () {
        var now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        currentDate = todayStr();
        clearSearch();
        switchView('home');
        renderHome();
      });
    }

    var calGrid = $('#calGrid');
    if (calGrid) {
      calGrid.addEventListener('click', function (e) {
        var cell = e.target.closest('.cal-cell');
        if (!cell) return;
        currentDate = cell.getAttribute('data-date');
        clearSearch();
        switchView('home');
        renderHome();
      });
    }

    var monthList = $('#monthList');
    if (monthList) {
      monthList.addEventListener('click', function (e) {
        var item = e.target.closest('.date-item');
        if (!item) return;
        currentDate = item.getAttribute('data-date');
        clearSearch();
        switchView('home');
        renderHome();
      });
    }
  }

  /* ==================================================
     启动
  ================================================== */
  function init() {
    load();

    var cal = $('#viewCalendar');
    var home = $('#viewHome');
    if (cal) cal.classList.add('hidden');
    if (home) home.classList.remove('hidden');

    bindEvents();
    renderHome();
    syncAddBtn();

    var qi = $('#quickInput');
    if (qi) qi.focus();
  }

  /* 跨天自动切换 */
  setInterval(function () {
    if (currentDate < todayStr()) {
      currentDate = todayStr();
      renderHome();
    }
  }, 60000);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
